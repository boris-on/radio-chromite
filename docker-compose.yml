services:
  caddy:
    image: caddy:2-alpine
    environment:
      RADIO_DOMAIN: ${RADIO_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "10"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    environment:
      AUDIO_SERVER_PORT: "8789"
      MUSIC_LIBRARY_PATH: /music
      NORMALIZED_LIBRARY_PATH: /music-normalized

    volumes:
      - type: bind
        source: ${MUSIC_LIBRARY_PATH:?Set MUSIC_LIBRARY_PATH in .env}
        target: /music
        read_only: true

      - type: bind
        source: ${NORMALIZED_LIBRARY_PATH:?Set NORMALIZED_LIBRARY_PATH in .env}
        target: /music-normalized
        read_only: true

      - cover-cache:/app/.cover-cache

    expose:
      - "8789"

    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "10"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8789/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_AUDIO_API_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8789

    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"

    expose:
      - "3000"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "10"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  cover-cache:
  caddy-data:
  caddy-config:
